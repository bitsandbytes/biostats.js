<!DOCTYPE html>
<!--
  Static Swagger UI for the biostats.js docs site. The spec is generated by the
  backend (springdoc, OpenApiDocsTest) and published on the backend's own Pages
  site; this page loads it from there instead of keeping a second copy. Both sites
  are on bitsandbytes.github.io, and GitHub Pages allows cross-origin reads.
  API_CONTRACT.md in this repo remains the source of truth.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>biostats API — Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    body { margin: 0; background: #fff; }
    .back { font: 14px sans-serif; padding: 8px 16px; background: #1b1b1b; }
    .back a { color: #fff; }
  </style>
</head>
<body>
  <div class="back"><a href="../api">&larr; Back to the docs</a></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "https://bitsandbytes.github.io/biostats-service/openapi/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      // Credentials for "Try it out" stay in this browser tab only.
      persistAuthorization: false,
    });
  </script>
</body>
</html>
